<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#233a28"/>
      <stop offset="100%" stop-color="#1b241f"/>
    </linearGradient>
    <linearGradient id="swirl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5fa336"/>
      <stop offset="100%" stop-color="#3f7a2a"/>
    </linearGradient>
    <linearGradient id="drops" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#8bc76a"/>
      <stop offset="100%" stop-color="#5fa336"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Cyclone swirl arcs — three curved strokes suggesting rotation -->
  <g fill="none" stroke="url(#swirl)" stroke-linecap="round" opacity="0.35">
    <path d="M256 130 A126 126 0 0 1 382 256" stroke-width="28"/>
    <path d="M256 382 A126 126 0 0 1 130 256" stroke-width="28"/>
    <path d="M326 146 A140 140 0 0 1 366 326" stroke-width="18" opacity="0.25"/>
    <path d="M186 366 A140 140 0 0 1 146 186" stroke-width="18" opacity="0.25"/>
  </g>

  <!-- Spray droplets radiating from center -->
  <g fill="url(#drops)" opacity="0.5">
    <circle cx="256" cy="148" r="8"/>
    <circle cx="256" cy="126" r="5"/>
    <circle cx="340" cy="172" r="7"/>
    <circle cx="362" cy="156" r="4.5"/>
    <circle cx="172" cy="172" r="7"/>
    <circle cx="150" cy="156" r="4.5"/>
    <circle cx="362" cy="256" r="6"/>
    <circle cx="384" cy="252" r="4"/>
    <circle cx="150" cy="256" r="6"/>
    <circle cx="128" cy="252" r="4"/>
    <circle cx="340" cy="340" r="6"/>
    <circle cx="172" cy="340" r="6"/>
  </g>

  <!-- Central "3" numeral -->
  <text x="256" y="310" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-weight="800" font-size="220" fill="#ffffff" letter-spacing="-8">3</text>

  <!-- Subtle inner ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#5fa336" stroke-width="3" opacity="0.2"/>
</svg>
